<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>

    <form id="registration-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-error">
        <p class="field-error" id="name-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error">
        <p class="field-error" id="email-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" aria-describedby="password-hint password-error">
        <p class="hint" id="password-hint">At least 8 characters.</p>
        <p class="field-error" id="password-error" role="alert"></p>
      </div>

      <button type="submit">Create account</button>

      <p class="status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
